name: ci
on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BATON_LOG_LEVEL: debug
      BATON_AUTH_TOKEN: ${{ secrets.BATON_AUTH_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build baton-trayai
        run: go build ./cmd/baton-trayai
      - name: Test syncing
        uses: ConductorOne/github-workflows/actions/sync-test@v4
        with:
          connector: ./baton-trayai
          baton-entitlement: 'entitlement:group:1234:member'
          baton-principal: 'user:9876'
          baton-principal-type: 'user'
